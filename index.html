<head>

    <title>Hand Control Particles</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<body>
    <!-- UI Overlay for Instructions and Status -->
    <div id="ui"
        style="position: absolute; top: 40px; left: 40px; color: rgba(255, 255, 255, 0.9); font-family: 'Space Mono', monospace; font-size: 20px; pointer-events: none; user-select: none; z-index: 100; text-shadow: 0 0 10px rgba(0,255,255,0.5);">

    <div id="start-overlay"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s;">
        <h1 style="color: white; font-family: 'Space Mono', monospace; margin-bottom: 20px;">Hand Control Particles</h1>
        <button id="start-btn"
            style="background: #00ffff; color: #000; border: none; padding: 15px 40px; font-size: 18px; font-family: 'Space Mono', monospace; cursor: pointer; border-radius: 4px; font-weight: bold;">START

        <p style="color: rgba(255,255,255,0.5); margin-top: 15px; font-family: sans-serif; font-size: 14px;">Camera
